# Robolectric refuses to build an SDK 36 sandbox on JDK 17 ("Android SDK 36
# requires Java 21"), which is the toolchain this project and its CI build
# with, so every Robolectric test that did not pin an sdk failed to start.
# Pin the sandbox instead of raising the whole build's JDK; the shell's
# minSdk is 28 and none of these tests assert API-36-specific behaviour.
sdk=35
