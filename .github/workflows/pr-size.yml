name: PR Size Labeling

# Applies a `size/{XS,S,M,L,XL}` label to each PR based on its added +
# deleted lines (excluding lock / generated files), so reviewers can gauge
# review effort at a glance. Runs as pull_request_target so it can label fork
# PRs, but never checks out or executes PR code -- it reads file stats and
# updates labels via the API, using only the default-branch script.

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: pr-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label-pr-size:
    name: PR Size Labeling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default-branch script
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: main
          sparse-checkout: |
            .github/scripts/trusted_ci_api.py
            .github/scripts/pr-size
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      - name: Test trusted size-label helper
        run: |
          python3 .github/scripts/trusted_ci_api_test.py
          python3 .github/scripts/pr-size/apply_label_test.py

      - name: Compute and apply size label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 .github/scripts/pr-size/apply_label.py
